<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Chess Game</title>

    <!-- chessboard.css from new chess subfolder -->
    <link rel="stylesheet" href="/chess/lib/chessboardjs/css/chessboard-1.0.0.min.css" />

    <!-- your CSS -->
    <link rel="stylesheet" href="/chess/css/styles.css" />
</head>
<body>
<main>
    <h1>Chess Game</h1>

    <div class="container">
        <div id="board" class="board" style="width: 400px;"></div>

        <h2>Clocks</h2>
        <div class="clocks">
            <div>White: <span id="whiteClock">05:00</span></div>
            <div>Black: <span id="blackClock">05:00</span></div>
        </div>
        
        <aside class="sidebar">
            <div id="status" class="status"></div>
            <div class="controls">
                <button id="resetBtn">New Game</button>
                <button id="flipBtn">Flip</button>
                <button id="undoBtn">Undo</button>
            </div>
            <div class="info">
                <div><strong>FEN</strong></div>
                <textarea id="fen" rows="2" readonly></textarea>
                <div><strong>Moves</strong></div>
                <div id="moves" class="moves"></div>
            </div>
        </aside>
    </div>
</main>

<!-- vendor libs from chess subfolder (jQuery is only for chessboard.js internals) -->
<script defer src="lib/jquery/jquery-3.7.1.min.js"></script>
<script defer src="lib/chessboardjs/js/chessboard-1.0.0.min.js"></script>
<script defer src="lib/chessjs/chess.min.js"></script>

<!-- your app JS -->
<script defer src="js/app.js"></script>

</body>
</html>
